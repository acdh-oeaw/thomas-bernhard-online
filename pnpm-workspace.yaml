allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  lefthook: true

autoDedupe: true

engineStrict: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 1440

packageExtensions:
  eslint-plugin-playwright:
    peerDependenciesMeta:
      eslint:
        optional: true

patchedDependencies:
  next: patches/next.patch

saveTypes: true

shellEmulator: true
